    <text x="75" y="944" font-size="25" fill="#243c3a" font-weight="800">홀 5 : 짝 1</text><rect x="255" y="917" width="122.9" height="39" rx="5" fill="#28716a"/><line x1="395.9" y1="910" x2="395.9" y2="961" stroke="#d4663b" stroke-width="6"/><text x="892" y="944" font-size="25" font-weight="850" fill="#183f3b">99회</text><text x="1031" y="944" font-size="23" fill="#526a66">7.93%</text>
    <text x="75" y="1005" font-size="25" fill="#243c3a" font-weight="800">홀 6 : 짝 0</text><rect x="255" y="978" width="23.6" height="39" rx="5" fill="#28716a"/><line x1="274.2" y1="971" x2="274.2" y2="1022" stroke="#d4663b" stroke-width="6"/><text x="892" y="1005" font-size="25" font-weight="850" fill="#183f3b">19회</text><text x="1031" y="1005" font-size="23" fill="#526a66">1.52%</text>
  </g>
  <rect x="72" y="1040" width="1058" height="72" rx="8" fill="#fff6e7" stroke="#eedcca" stroke-width="2"/>
  <text x="99" y="1074" font-size="24" font-weight="850" fill="#a75b33" font-family="sans-serif">한 가지 놓치기 쉬운 사실</text>
  <text x="99" y="1103" font-size="22" font-weight="750" fill="#3e514d" font-family="sans-serif">1~45에는 홀수 23개, 짝수 22개  ·  3:3도 전체 조합의 33.48%뿐</text>
  <text x="74" y="1140" font-size="18" fill="#7b8882" font-family="sans-serif">로또6/45 본번호 기준 · 특정 6개 조합의 1등 확률은 모두 동일</text>
