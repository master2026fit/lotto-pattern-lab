  <g font-size="17" fill="#83918c" font-family="sans-serif"><text x="255" y="576">0%</text><text x="401" y="576">10%</text><text x="556" y="576">20%</text><text x="711" y="576">30%</text><text x="789" y="576">35%</text></g>
