<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1190" width="1200" height="1190" role="img" aria-labelledby="title description">
  <title id="title">로또 홀짝 3대3 vs 2대4 4대2 전수조사</title>
  <desc id="description">1회부터 1248회까지 홀짝 조합 실제 분포. 홀수3 짝수3 414회 33.17퍼센트. 홀수2 짝수4 또는 홀수4 짝수2 합계615회49.28퍼센트. 홀수는 23개 짝수는22개이다. 모든 한 게임 1등 확률은 동일하다.</desc>
  <rect width="1200" height="1190" fill="#f8faf9"/>
  <rect x="28" y="28" width="1144" height="1134" fill="#fff" stroke="#d4ddda" stroke-width="3"/>
  <rect x="70" y="70" width="360" height="45" rx="22" fill="#185750"/>
  <text x="92" y="100" fill="#fff" font-size="22" font-family="sans-serif" font-weight="850">LOTTO NOTE   |   별난 로또 실험실 ⑫</text>
  <text x="69" y="182" fill="#173f3d" font-size="52" font-family="sans-serif" font-weight="900">홀짝 3:3이 정답일까?</text>
  <text x="70" y="230" fill="#75817e" font-size="24" font-family="sans-serif">1~1248회 본번호 6개 · 1,248개 실제 결과 전수 비교</text>
  <line x1="70" y1="260" x2="1132" y2="260" stroke="#dfe7e5" stroke-width="3"/>
  <rect x="72" y="294" width="500" height="160" rx="16" fill="#1c5953"/>
  <text x="107" y="342" fill="#e9fbf6" font-size="22" font-family="sans-serif" font-weight="700">홀수 3 · 짝수 3</text>
  <text x="107" y="414" fill="#fff" font-size="73" font-family="sans-serif" font-weight="900">33.17%</text>
  <rect x="592" y="294" width="538" height="160" rx="16" fill="#fff2e8" stroke="#ffd6be" stroke-width="3"/>
  <text x="629" y="342" fill="#ab5937" font-size="22" font-family="sans-serif" font-weight="700">홀수 2·짝수 4 + 홀수 4·짝수 2</text>
  <text x="629" y="414" fill="#d16238" font-size="73" font-family="sans-serif" font-weight="900">49.28%</text>
  <text x="70" y="515" fill="#1e4a49" font-size="30" font-weight="850" font-family="sans-serif">실제 분포와 수학적 예상 비교</text>
  <text x="71" y="547" fill="#71817c" font-size="19" font-family="sans-serif">녹색 막대 = 실제 비율  |  주황색 세로선 = 이론상 비율</text>
