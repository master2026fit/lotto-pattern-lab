 <text x="70" y="78" fill="#2b332b" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="38" font-weight="800">19번은 왜 계속 3구로 돌아왔을까?</text>
 <text x="70" y="125" fill="#697468" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21">실제 6차례 연속 ‘출현’ 기록 · 연속 6주 당첨이 아님</text>
