<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
 <title id="t">19번의 최근 6차례 출현 자리 기록과 전체 같은 자리 복귀율</title>
 <desc id="d">1214,1215,1225,1232,1234,1240회에 19번이 각각 3구에 등장. 1~1248회 전체 7,443쌍 중 2,882쌍이 같은 구에 재등장하여 38.72%, 무작위 이론 39.21%.</desc>
