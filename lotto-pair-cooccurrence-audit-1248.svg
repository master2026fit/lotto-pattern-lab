<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
  <title id="title">로또 최다 동반 출현 번호쌍이 무작위에서도 나타날 수 있는지 검증</title>
  <desc id="desc">로또1~1248회 990개 번호쌍 전수조사에서 가장 자주 함께 나온 11과21은 34회 등장했다. 특정 한 쌍의 기대 출현 횟수는18.91회지만, 2500번의 각 1248회 무작위 추첨 모의실험에서 990쌍 중 최다 등장하는 쌍의 평균은34.29회, 최고 횟수가 34회 이상인 실험은 1568번 즉62.72퍼센트였다. 1~624회의 최고 출현 쌍 20과35는 전반20회, 후반 625~1248회에서는6회로 줄었다.</desc>
  <rect width="1200" height="1110" fill="#faf9fd"/>
  <rect width="1200" height="13" fill="#5e3b8a"/>
  <text x="65" y="68" font-family="'Malgun Gothic',sans-serif" font-weight="850" font-size="19" fill="#60428c">LOTTO NOTE · 별난 로또 실험실 ⑩</text>
  <text x="64" y="133" font-family="'Malgun Gothic',sans-serif" font-weight="900" font-size="47" fill="#292434">34번 만난 두 숫자, 정말 특별할까?</text>
  <text x="66" y="180" font-family="'Malgun Gothic',sans-serif" font-size="22" fill="#665e74">본번호 6개 · 1~1248회 기록 · 가능한 990쌍 전체 조사</text>

  <rect x="62" y="223" width="515" height="271" rx="17" fill="#e9def6"/>
  <text x="94" y="268" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#56368b">실제 가장 자주 만난 번호쌍</text>
  <rect x="99" y="294" width="120" height="111" rx="13" fill="#5e3b8a"/>
  <rect x="238" y="294" width="120" height="111" rx="13" fill="#5e3b8a"/>
  <text x="159" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="900" fill="#fff">11</text>
  <text x="298" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="900" fill="#fff">21</text>
  <text x="375" y="374" font-family="Arial,sans-serif" font-size="51" font-weight="900" fill="#b32573">34</text>
  <text x="466" y="372" font-family="'Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#8c3a70">회</text>
  <text x="96" y="455" font-family="'Malgun Gothic',sans-serif" font-size="18" fill="#6c5684">전체 990개 쌍 가운데 최다 출현</text>

  <rect x="591" y="223" width="548" height="271" rx="17" fill="#f4f0e4"/>
  <text x="625" y="268" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#635e43">서로 다른 특정 한 쌍의 이론 평균</text>
  <text x="624" y="384" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#7c6d39">18.91</text>
  <text x="950" y="383" font-family="'Malgun Gothic',sans-serif" font-size="27" font-weight="800" fill="#766642">회</text>
  <text x="625" y="455" font-family="'Malgun Gothic',sans-serif" font-size="18" fill="#746c53">한 회차 동반 확률 1/66 · 1248회 기대 횟수</text>

  <text x="67" y="565" font-family="'Malgun Gothic',sans-serif" font-size="32" font-weight="900" fill="#2b2635">하지만 ‘990쌍 중 최고’끼리 비교하면?</text>
  <rect x="61" y="598" width="1078" height="270" rx="17" fill="#ffffff" stroke="#d7d0e5" stroke-width="2"/>
  <text x="100" y="655" font-family="'Malgun Gothic',sans-serif" font-size="23" fill="#584976">실제 최고 출현 횟수</text>
  <text x="1076" y="655" text-anchor="end" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#63338b">34회</text>
  <text x="100" y="721" font-family="'Malgun Gothic',sans-serif" font-size="23" fill="#584976">무작위 모의실험의 최고치 평균</text>
  <text x="1076" y="721" text-anchor="end" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#63338b">34.29회</text>
  <path d="M100 747H1090" stroke="#e7e2ef" stroke-width="2"/>
  <text x="100" y="804" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="850" fill="#483a5e">모의실험에서 최고치가 34회 이상인 비율</text>
  <text x="1080" y="807" text-anchor="end" font-family="Arial,sans-serif" font-size="41" font-weight="900" fill="#ac246e">62.72%</text>
  <text x="99" y="844" font-family="'Malgun Gothic',sans-serif" font-size="18" fill="#726781">각각 1248회를 재현한 2500번의 난수 실험 중 1568번</text>

  <rect x="62" y="893" width="1078" height="155" rx="15" fill="#f9edf4"/>
  <text x="99" y="942" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="850" fill="#92366f">전반부 최다쌍 20·35를 후반부에 다시 검증</text>
  <text x="100" y="1008" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#54415f">1~624회</text>
  <text x="301" y="1008" font-family="Arial,sans-serif" font-size="45" font-weight="900" fill="#673c91">20회</text>
  <text x="482" y="1008" font-family="Arial,sans-serif" font-size="43" fill="#8e7a92">→</text>
  <text x="565" y="1008" font-family="'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#54415f">625~1248회</text>
  <text x="872" y="1008" font-family="Arial,sans-serif" font-size="45" font-weight="900" fill="#ae326e">6회</text>
  <text x="67" y="1087" font-family="'Malgun Gothic',sans-serif" font-size="18" fill="#6d6674">※ 보너스번호 제외. 무작위 실험은 관측 가능한 최고 횟수의 분포를 보여주며 당첨 예측 모델이 아닙니다.</text>
</svg>