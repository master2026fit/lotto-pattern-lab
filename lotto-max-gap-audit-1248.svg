  <rect x="72" y="918" width="1056" height="114" rx="10" fill="#fff5eb" stroke="#ffd8bd" stroke-width="2"/>
  <text x="98" y="959" fill="#b54f2b" font-size="23" font-weight="850" font-family="sans-serif">실제 가장 큰 빈칸 · 523회</text>
  <text x="98" y="1006" fill="#263c56" font-size="29" font-weight="900" font-family="sans-serif">1 · 4  ── 빈 숫자 5~36 : 32개 ──  37 · 38 · 40 · 45</text>
  <text x="74" y="1062" fill="#758494" font-size="18" font-family="sans-serif">빈칸 = 정렬한 인접 두 번호의 차이 − 1  ·  보너스번호 제외  ·  미래 당첨을 보장하지 않음</text>
