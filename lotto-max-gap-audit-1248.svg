<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="1200" height="1110" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">로또 당첨번호 여섯 개 사이 최대 빈칸 전수조사</title>
  <desc id="figure-desc">로또 1회부터1248회까지 정렬한 6개 숫자의 인접한 다섯 구간 중 가장 큰 빈칸 수를 조사했다. 0~4개17회1.36퍼센트,5~9개264회21.15퍼센트,10~14개542회43.43퍼센트,15~19개304회24.36퍼센트,20개 이상121회9.70퍼센트. 실제 최대 빈칸은 523회4번과37번 사이 32개이다.</desc>
  <rect width="1200" height="1110" fill="#f7fafd"/>
  <rect x="28" y="28" width="1144" height="1054" fill="#fff" stroke="#d7e1eb" stroke-width="3"/>
  <rect x="68" y="64" width="367" height="44" rx="5" fill="#1452b2"/>
  <text x="90" y="94" fill="#fff" font-size="23" font-family="sans-serif" font-weight="850">LOTTO NOTE  ·  별난 로또 실험실 ⑬</text>
  <text x="69" y="174" fill="#173866" font-size="49" font-family="sans-serif" font-weight="900">번호 사이, 어디까지 비어도 괜찮을까?</text>
  <text x="70" y="220" fill="#6e7886" font-size="23" font-family="sans-serif">1~1248회 본번호 6개 · 다섯 구간 중 가장 긴 공백 조사</text>
  <line x1="71" y1="246" x2="1130" y2="246" stroke="#dbe3ed" stroke-width="3"/>
  <rect x="72" y="277" width="504" height="149" rx="12" fill="#114db0"/>
  <text x="103" y="325" fill="#d6e8ff" font-size="22" font-weight="800" font-family="sans-serif">가장 흔했던 최대 빈칸 범위</text>
  <text x="103" y="394" fill="#fff" font-size="65" font-weight="900" font-family="sans-serif">10~14개</text>
  <rect x="594" y="277" width="534" height="149" rx="12" fill="#fff0e9" stroke="#f6d3c1" stroke-width="2"/>
  <text x="624" y="325" fill="#a6583d" font-size="22" font-weight="800" font-family="sans-serif">20개 이상 빈 회차 비율</text>
  <text x="624" y="394" fill="#df6240" font-size="65" font-weight="900" font-family="sans-serif">9.70%</text>
  <text x="73" y="484" fill="#183966" font-size="29" font-weight="850" font-family="sans-serif">실제 1,248회 vs 가능한 전체 조합</text>
  <text x="74" y="516" fill="#7a8291" font-size="18" font-family="sans-serif">파랑 = 실제 출현 비율  |  주황 세로선 = 수학적 확률</text>
  <g stroke="#e7edf4" stroke-width="2"><line x1="288" y1="555" x2="288" y2="888"/><line x1="410" y1="555" x2="410" y2="888"/><line x1="532" y1="555" x2="532" y2="888"/><line x1="654" y1="555" x2="654" y2="888"/><line x1="776" y1="555" x2="776" y2="888"/><line x1="837" y1="555" x2="837" y2="888"/></g>
