name: Weekly predraw 45-number snapshot

on:
  push:
    paths:
      - '.github/workflows/weekly-predraw.yml'
      - 'scripts/capture_weekly.mjs'
      - 'scripts/capture_weekly.test.mjs'
      - 'scripts/build_exclusion_snapshot.mjs'
      - 'scripts/build_exclusion_snapshot.test.mjs'
      - 'exclusion_lab.js'
      - 'scripts/connection_ledger.mjs'
      - 'scripts/connection_ledger.test.mjs'
      - 'scripts/capture_connections.mjs'
  # UTC: Friday 12:13, Saturday 14:13 and 18:13 in Korea.
  schedule:
    - cron: '13 3 * * 5'
    - cron: '13 5 * * 6'
    - cron: '13 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-predraw-pattern-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scanner browser
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Validate scan data logic
        run: node --test scripts/capture_weekly.test.mjs
      - name: Capture verified predraw scan
        run: node scripts/capture_weekly.mjs
      - name: Validate immutable connection forecast logic
        run: node --test scripts/connection_ledger.test.mjs
      - name: Capture prospective connection forecasts
        run: node scripts/capture_connections.mjs
      - name: Validate exclusion shadow research
        run: node --test scripts/build_exclusion_snapshot.test.mjs
      - name: Freeze exclusion research separately before draw
        run: node scripts/build_exclusion_snapshot.mjs
      - name: Save public scan history
        run: |
          git add -- data/weekly_scans.json data/exclusion_scans.json data/connection_forecasts.json
          if git diff --cached --quiet; then
            echo 'No new valid predraw snapshot.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: preserve predraw 45-number and exclusion shadow scans'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            echo 'Predraw publishing failed after three retries' >&2
            exit 1
          fi
