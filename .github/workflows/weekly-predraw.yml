name: Weekly predraw 45-number snapshot

on:
  push:
    paths:
      - '.github/workflows/weekly-predraw.yml'
      - 'scripts/capture_weekly.mjs'
      - 'scripts/capture_weekly.test.mjs'
  # UTC: Friday 12:13, Saturday 14:13 and 18:13 in Korea.
  schedule:
    - cron: '13 3 * * 5'
    - cron: '13 5 * * 6'
    - cron: '13 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-predraw-pattern-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scanner browser
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Validate scan data logic
        run: node --test scripts/capture_weekly.test.mjs
      - name: Capture verified predraw scan
        run: node scripts/capture_weekly.mjs
      - name: Save public scan history
        run: |
          if git diff --quiet -- data/weekly_scans.json; then
            echo 'No new valid predraw snapshot.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/weekly_scans.json
            git commit -m 'data: preserve weekly predraw 45-number scan'
            git push
          fi
