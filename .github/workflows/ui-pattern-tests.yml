name: Check historical slot-chain research

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/ui_slot_chain.test.mjs'
      - '.github/workflows/ui-pattern-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/ui_slot_chain.test.mjs'
      - '.github/workflows/ui-pattern-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify same-number slot chains and no future leakage
        run: node --test scripts/ui_slot_chain.test.mjs
