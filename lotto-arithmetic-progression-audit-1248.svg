<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="654회 당첨번호에서 발견한 5개 등차수열과 1~1248회 전수조사 결과">
  <rect width="1200" height="770" fill="#f8f7f3"/>
  <rect x="42" y="37" width="1116" height="696" rx="18" fill="#ffffff" stroke="#deddd7"/>
  <text x="80" y="95" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#b5463c">LOTTO NOTE / 별난 로또 실험실 ⑯</text>
  <text x="80" y="156" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="42" font-weight="850" fill="#21242b">당첨번호 다섯 개가 정확히 5씩 커졌다</text>
  <text x="80" y="192" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="22" fill="#555b65">654회 실제 당첨번호: 16 · 21 · 26 · 31 · 36 · 43</text>
  <rect x="78" y="228" width="1040" height="220" rx="16" fill="#f5f2ed"/>
  <g font-family="Pretendard,'Noto Sans KR',sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#ad483e" stroke-width="3">
      <rect x="101" y="272" width="124" height="100" rx="12"/>
      <rect x="280" y="272" width="124" height="100" rx="12"/>
      <rect x="459" y="272" width="124" height="100" rx="12"/>
      <rect x="638" y="272" width="124" height="100" rx="12"/>
      <rect x="817" y="272" width="124" height="100" rx="12"/>
    </g>
    <g font-size="48" font-weight="850" fill="#26303e">
      <text x="163" y="338">16</text><text x="342" y="338">21</text><text x="521" y="338">26</text><text x="700" y="338">31</text><text x="879" y="338">36</text>
    </g>
    <g fill="#b5463c" font-size="18" font-weight="800">
      <text x="253" y="310">+5</text><text x="432" y="310">+5</text><text x="611" y="310">+5</text><text x="790" y="310">+5</text>
    </g>
    <rect x="969" y="272" width="124" height="100" rx="12" fill="#e4e4e0" stroke="#c5c5bf" stroke-width="2"/>
    <text x="1031" y="338" font-size="48" font-weight="800" fill="#62666d">43</text>
    <text x="1031" y="404" font-size="17" fill="#757b84">별개 번호</text>
    <text x="520" y="410" font-size="18" font-weight="700" fill="#b5463c">공차 5인 다섯 숫자의 등차수열</text>
  </g>
  <text x="80" y="506" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="27" font-weight="850" fill="#21242b">1~1248회 전수조사 결과</text>
  <text x="80" y="538" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="18" fill="#5b606a">당첨번호 6개 중 가장 긴 등차수열 길이 / 공차 2 이상 / 보너스 제외</text>
  <g font-family="Pretendard,'Noto Sans KR',sans-serif" text-anchor="middle">
    <g>
      <rect x="80" y="564" width="190" height="103" rx="12" fill="#f0f0ef"/>
