      <text x="175" y="639" font-size="37" font-weight="850" fill="#282c33">668회</text>
    </g>
    <g>
      <rect x="293" y="564" width="190" height="103" rx="12" fill="#f0f0ef"/>
      <text x="388" y="592" font-size="19" font-weight="650" fill="#424957">3개</text>
      <text x="388" y="639" font-size="37" font-weight="850" fill="#282c33">547회</text>
    </g>
    <g>
      <rect x="506" y="564" width="190" height="103" rx="12" fill="#f0f0ef"/>
      <text x="601" y="592" font-size="19" font-weight="650" fill="#424957">4개</text>
      <text x="601" y="639" font-size="37" font-weight="850" fill="#282c33">32회</text>
    </g>
    <g>
      <rect x="719" y="564" width="190" height="103" rx="12" fill="#b5463c"/>
      <text x="814" y="592" font-size="19" font-weight="650" fill="#fff">5개</text>
      <text x="814" y="639" font-size="37" font-weight="850" fill="#fff">1회</text>
    </g>
    <g>
      <rect x="932" y="564" width="186" height="103" rx="12" fill="#f0f0ef"/>
      <text x="1025" y="592" font-size="19" font-weight="650" fill="#424957">6개</text>
      <text x="1025" y="639" font-size="37" font-weight="850" fill="#282c33">0회</text>
    </g>
  </g>
  <text x="80" y="701" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="17" fill="#666b73">전체 8,145,060개 조합 중 5개 등차수열이 가장 긴 조합: 7,320개 (0.0899%)</text>
  <text x="1118" y="707" text-anchor="end" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="16" font-weight="750" fill="#8b8e95">© LOTTO NOTE</text>
