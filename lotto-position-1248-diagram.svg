<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">로또 1~6구 자리별 기록: 5, 19, 39번</title>
  <desc id="desc">1~1248회 본당첨번호를 오름차순으로 정렬한 위치별 횟수. 5번 1·2구, 19번 2·3·4구, 39번 5·6구를 붉게 강조한다.</desc>
  <rect width="1200" height="675" fill="#112c44"/>
  <rect x="48" y="33" width="11" height="105" rx="5" fill="#e9bd7a"/>
  <text x="82" y="85" fill="#fff8eb" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="38" font-weight="800">같은 번호, 다른 자리</text>
  <text x="84" y="122" fill="#bfd7e2" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21">1~1248회 실제 기록 · 번호 오름차순 1~6구 · 보너스번호 제외</text>
