<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">로또 이월수 전수검증: 1회부터 1248회, 1247번의 연속 회차 비교</title>
  <desc id="chart-desc">한 개 이상 이월수는 실제 61.43퍼센트, 이론상 59.94퍼센트. 0개 481번 38.57퍼센트, 1개 529번 42.42퍼센트, 2개 211번 16.92퍼센트, 3개 이상 26번 2.08퍼센트. 3번은 203회부터 207회까지 5회 연속 출현했다.</desc>
  <rect width="1200" height="1050" fill="#fcf9ef"/>
  <rect x="28" y="28" width="1144" height="994" fill="#fffdf8" stroke="#dcd4c8" stroke-width="3"/>
  <rect x="58" y="56" width="342" height="39" rx="4" fill="#0c3c78"/>
  <text x="80" y="83" fill="#fff" font-size="21" font-weight="800" font-family="sans-serif">LOTTO NOTE  ·  별난 로또 실험실 ⑪</text>
  <text x="72" y="162" fill="#173c73" font-size="52" font-weight="900" font-family="sans-serif">지난주 번호가 또 나온다?</text>
  <text x="74" y="207" fill="#6a6970" font-size="24" font-family="sans-serif">1~1248회 당첨번호 6개  ·  연속 회차 1,247쌍 분석</text>
  <line x1="70" y1="235" x2="1130" y2="235" stroke="#c9c6bf" stroke-width="3"/>
  <rect x="72" y="268" width="500" height="164" rx="12" fill="#133f77"/>
  <text x="108" y="313" fill="#deebfc" font-size="23" font-weight="700" font-family="sans-serif">한 개 이상 이월수 발견</text>
  <text x="108" y="388" fill="#ffffff" font-size="76" font-weight="900" font-family="sans-serif">61.43%</text>
  <rect x="589" y="268" width="539" height="164" rx="12" fill="#f9eee8" stroke="#e3cdc2" stroke-width="2"/>
  <text x="623" y="313" fill="#8e4b39" font-size="23" font-weight="700" font-family="sans-serif">공정 추첨의 수학적 확률</text>
  <text x="623" y="388" fill="#c44b35" font-size="76" font-weight="900" font-family="sans-serif">59.94%</text>
  <text x="76" y="492" fill="#173c73" font-size="30" font-weight="850" font-family="sans-serif">전 회차 번호가 몇 개나 다시 나왔을까?</text>
  <text x="77" y="526" fill="#777275" font-size="18" font-family="sans-serif">짙은 파랑 = 실제 관측 비율   ·   빨간 세로선 = 이론적 확률</text>
