  <text x="98" y="946" font-size="29" font-weight="800" fill="#2f3b50" font-family="sans-serif">3번은 203·204·205·206·207회에 5회 연속 등장</text>
  <text x="73" y="1001" font-size="18" fill="#78716b" font-family="sans-serif">본번호만 집계 · 보너스 제외 · 과거 사례는 다음 추첨 확률을 높이지 않음</text>
