<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="185회 당첨번호 1 2 4 8 19 38에서 2배 배수 사슬과 1~1248회 배수 사슬 발견 횟수">
  <rect width="1200" height="790" fill="#fbfaf8"/>
  <rect x="35" y="35" width="1130" height="720" rx="18" fill="#fff" stroke="#e3e4e0" stroke-width="2"/>
  <text x="77" y="95" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="19" font-weight="750" fill="#ba512d" letter-spacing="2">LOTTO NOTE / 별난 로또 실험실 ⑱</text>
  <text x="77" y="151" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="39" font-weight="850" fill="#1c2835">185회 당첨번호엔 두 가지 ‘2배’가 있었다</text>
  <text x="77" y="192" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="21" fill="#6c737c">실제 당첨번호 1 · 2 · 4 · 8 · 19 · 38 (보너스 제외)</text>
  <rect x="72" y="226" width="1056" height="239" rx="16" fill="#fff6e9"/>
  <g font-family="Pretendard,'Noto Sans KR',sans-serif">
    <text x="104" y="268" font-size="20" font-weight="800" fill="#ad4b27">최장 4개 배수 사슬</text>
    <g fill="#ffffff" stroke="#dc7e51" stroke-width="2">
      <rect x="102" y="287" width="129" height="100" rx="12"/>
      <rect x="320" y="287" width="129" height="100" rx="12"/>
      <rect x="538" y="287" width="129" height="100" rx="12"/>
      <rect x="756" y="287" width="129" height="100" rx="12"/>
    </g>
    <g font-size="52" font-weight="850" text-anchor="middle" fill="#273747">
      <text x="166" y="355">1</text><text x="384" y="355">2</text><text x="602" y="355">4</text><text x="820" y="355">8</text>
    </g>
    <g font-size="22" font-weight="850" fill="#bb5530" text-anchor="middle">
      <text x="274" y="348">×2 →</text><text x="492" y="348">×2 →</text><text x="710" y="348">×2 →</text>
    </g>
    <rect x="939" y="287" width="164" height="100" rx="12" fill="#263748"/>
    <text x="1021" y="328" fill="#fff" font-size="24" font-weight="750" text-anchor="middle">19 → 38</text>
    <text x="1021" y="364" fill="#ffda9d" font-size="19" font-weight="750" text-anchor="middle">별도 ×2</text>
    <text x="104" y="431" fill="#775c49" font-size="18">숫자 4개가 같은 비율 2로 이어지고, 나머지 2개도 별도 배수쌍을 이룹니다.</text>
  </g>
  <text x="77" y="512" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="27" font-weight="850" fill="#253747">1~1248회 최장 배수 사슬의 길이별 분포</text>
  <text x="77" y="545" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="18" fill="#646d76">각 회차의 본번호 6개 중 같은 정수배(2배 이상)로 이어지는 가장 긴 배열만 셈</text>
  <g font-family="Pretendard,'Noto Sans KR',sans-serif" text-anchor="middle">
    <rect x="80" y="573" width="194" height="113" rx="10" fill="#edf0f2"/>
    <text x="177" y="610" font-size="19" fill="#4a5b6a">배수쌍 없음</text><text x="177" y="658" font-size="35" font-weight="850" fill="#263748">333회</text>
    <rect x="292" y="573" width="194" height="113" rx="10" fill="#edf0f2"/>
    <text x="389" y="610" font-size="19" fill="#4a5b6a">2개</text><text x="389" y="658" font-size="35" font-weight="850" fill="#263748">879회</text>
    <rect x="504" y="573" width="194" height="113" rx="10" fill="#edf0f2"/>
    <text x="601" y="610" font-size="19" fill="#4a5b6a">3개</text><text x="601" y="658" font-size="35" font-weight="850" fill="#263748">35회</text>
    <rect x="716" y="573" width="194" height="113" rx="10" fill="#c85633"/>
    <text x="813" y="610" font-size="19" fill="#fff">4개</text><text x="813" y="658" font-size="35" font-weight="850" fill="#fff">1회</text>
    <rect x="928" y="573" width="194" height="113" rx="10" fill="#edf0f2"/>
    <text x="1025" y="610" font-size="19" fill="#4a5b6a">5개 이상</text><text x="1025" y="658" font-size="35" font-weight="850" fill="#263748">0회</text>
  </g>
  <text x="80" y="726" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="16" fill="#65717d">전체 8,145,060개 조합 중 최장 4개인 경우 4,761개 (0.0585%) · 기대 횟수 약 0.73회</text>
</svg>
