<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1230" role="img" aria-labelledby="t d">
<title id="t">로또 1~1248회 소수 출현 개수별 전수조사</title>
<desc id="d">소수14개. 실제 소수0개109회,1개367회,2개446회,3개254회,4개64회,5개8회,6개0회. 모두 소수인 조합은 수학적으로3003가지.</desc>
<rect width="1000" height="1230" rx="24" fill="#fafaf6"/>
<path d="M0 18H1000" stroke="#ff571c" stroke-width="19"/>
<text x="48" y="85" fill="#202321" font-size="31" font-weight="850" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">별난 로또 실험실 ⑮  /  LOTTO NOTE</text>
<text x="48" y="148" fill="#202321" font-size="46" font-weight="950" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">당첨번호 여섯 개 중 소수는 몇 개?</text>
<rect x="48" y="180" width="904" height="177" rx="17" fill="#dbf3e6"/>
<text x="76" y="231" fill="#244538" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="850">1~45 중 소수는 14개</text>
<text x="76" y="284" fill="#183a2d" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="33" font-weight="850">2  3  5  7  11  13  17  19</text>
<text x="76" y="332" fill="#183a2d" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="33" font-weight="850">23  29  31  37  41  43</text>
<text x="48" y="424" fill="#252826" font-size="38" font-weight="900" font-family="Noto Sans KR,Malgun Gothic,sans-serif">1~1248회 실제 출현 횟수</text>
<text x="48" y="465" fill="#69756c" font-size="24" font-family="Noto Sans KR,Malgun Gothic,sans-serif">막대는 실제 회차 수  /  오른쪽은 무작위 조합의 수학적 비율</text>
<g font-family="Noto Sans KR,Malgun Gothic,sans-serif">
  <text x="50" y="531" font-size="29" font-weight="850" fill="#26352c">0개</text><rect x="145" y="503" width="148" height="41" rx="6" fill="#aaaeb0"/><text x="308" y="534" font-size="28" font-weight="780" fill="#292f2b">109회</text><text x="950" y="533" text-anchor="end" font-size="26" fill="#647468">예상 9.04%</text>
