  <text x="50" y="739" font-size="29" font-weight="850" fill="#26352c">2개</text><rect x="145" y="711" width="604" height="41" rx="6" fill="#34644b"/><text x="769" y="742" font-size="28" font-weight="780" fill="#292f2b">446회</text><text x="950" y="789" text-anchor="end" font-size="26" fill="#647468">예상 35.15%</text>
  <text x="50" y="846" font-size="29" font-weight="850" fill="#26352c">3개</text><rect x="145" y="818" width="344" height="41" rx="6" fill="#8ea89b"/><text x="508" y="849" font-size="28" font-weight="780" fill="#292f2b">254회</text><text x="950" y="895" text-anchor="end" font-size="26" fill="#647468">예상 20.09%</text>
  <text x="50" y="953" font-size="29" font-weight="850" fill="#26352c">4개</text><rect x="145" y="925" width="87" height="41" rx="6" fill="#aaaeb0"/><text x="249" y="956" font-size="28" font-weight="780" fill="#292f2b">64회</text><text x="950" y="966" text-anchor="end" font-size="26" fill="#647468">예상 5.71%</text>
  <text x="50" y="1032" font-size="29" font-weight="850" fill="#26352c">5개</text><rect x="145" y="1004" width="16" height="41" rx="5" fill="#ff571c"/><text x="182" y="1035" font-size="28" font-weight="850" fill="#e0501c">8회</text><text x="950" y="1035" text-anchor="end" font-size="26" fill="#647468">예상 0.762%</text>
  <text x="50" y="1101" font-size="29" font-weight="850" fill="#26352c">6개</text><rect x="145" y="1073" width="8" height="41" rx="3" fill="#ff571c" opacity="0.27"/><text x="182" y="1104" font-size="28" font-weight="900" fill="#e0501c">0회</text><text x="950" y="1104" text-anchor="end" font-size="26" fill="#647468">예상 0.0369%</text>
</g>
<path d="M49 1143H951" stroke="#ccd3cc" stroke-width="2"/>
<text x="50" y="1186" fill="#26392d" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="700">6개 모두 소수인 조합은 3,003가지 존재</text>
<text x="50" y="1214" fill="#69746c" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="17">실제 기록 1~1248회 · 본번호 6개 · 보너스번호 제외</text>
