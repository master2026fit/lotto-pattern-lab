  <rect x="66" y="417" width="1068" height="187" rx="20" fill="#fffefd" stroke="#ccdae2" stroke-width="2"/>
  <text x="92" y="459" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="900" fill="#173b55">남은 12수에 실제 본당첨번호가 포함될 기준 확률</text>
  <g font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="93" y="483" width="137" height="61" rx="5" fill="#8299a6"/><text x="161.5" y="508" fill="#fff" font-size="18">0개</text><text x="161.5" y="531" fill="#fff" font-size="16">13.60%</text>
    <rect x="232" y="483" width="352" height="61" rx="5" fill="#567b96"/><text x="408" y="508" fill="#fff" font-size="18">1개</text><text x="408" y="531" fill="#fff" font-size="17">34.97%</text>
    <rect x="586" y="483" width="334" height="61" rx="5" fill="#3e987e"/><text x="753" y="508" fill="#fff" font-size="18">2개</text><text x="753" y="531" fill="#fff" font-size="17">33.16%</text>
    <rect x="922" y="483" width="186" height="61" rx="5" fill="#d2a45f"/><text x="1015" y="508" fill="#203e51" font-size="18">3개 이상</text><text x="1015" y="531" fill="#203e51" font-size="16">18.28%</text>
  </g>
  <text x="94" y="581" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#5a7180">확률은 로또 6/45의 무작위 추첨 가정으로 계산 · 특정 검색법의 예측 성과가 아닙니다.</text>
  <text x="68" y="631" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-weight="800" font-size="16" fill="#4b6779">LOTTO NOTE · 2026.11.07 추첨 전 기록 · 예측·당첨 보장 아님</text>
