    <circle cx="1053" cy="250" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="1053" y="260" fill="#143e3c">16</text>
    <circle cx="548" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="548" y="343" fill="#143e3c">21</text>
    <circle cx="649" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="649" y="343" fill="#143e3c">29</text>
    <circle cx="750" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="750" y="343" fill="#143e3c">38</text>
    <circle cx="851" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="851" y="343" fill="#143e3c">40</text>
    <circle cx="952" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="952" y="343" fill="#143e3c">41</text>
    <circle cx="1053" cy="333" r="33" fill="#a8dccb" stroke="#44957c" stroke-width="2"/><text x="1053" y="343" fill="#143e3c">42</text>
